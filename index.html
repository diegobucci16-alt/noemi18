<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOEMI 18</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --blu: #0047FF; --argento: #C0C0C0; --nero: #000000; --grigio: #0a0a0a; }
        * { box-sizing: border-box; }
        body { background-color: var(--nero); color: white; font-family: 'Montserrat', sans-serif; margin: 0; overflow-x: hidden; text-align: center; }
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #001133 0%, #000 80%); z-index: -1; }
        header { padding: 80px 20px; }
        h1 { font-family: 'Syncopate', sans-serif; font-size: 3rem; background: linear-gradient(to bottom, #fff, var(--blu)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .date-badge { background: var(--blu); padding: 8px 20px; border-radius: 50px; display: inline-block; font-weight: 800; margin-bottom: 20px; }
        .swiper { width: 100%; padding: 30px 0; }
        .swiper-slide { width: 280px; height: 380px; border-radius: 20px; overflow: hidden; border: 2px solid var(--blu); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .section-card { background: var(--grigio); margin: 20px; padding: 30px; border-radius: 25px; border: 1px solid rgba(0, 71, 255, 0.3); }
        input, select { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: white; margin-top: 5px; margin-bottom: 15px; }
        .btn-submit { background: var(--blu); color: white; width: 100%; padding: 20px; border: none; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        #success-msg { display: none; color: #00FFCC; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <header>
        <div class="date-badge">18 APRILE 2026</div>
        <h1>NOEMI 18</h1>
        <p style="color: var(--argento); letter-spacing: 5px;">THE ELECTRIC NIGHT</p>
    </header>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="noemi1.jpeg"></div>
            <div class="swiper-slide"><img src="noemi3.jpeg"></div>
            <div class="swiper-slide"><img src="noemiq4.jpeg"></div>
            <div class="swiper-slide"><img src="noemi5.jpeg"></div>
        </div>
    </div>

    <section class="section-card">
        <h2>CONFERMA ORA</h2>
        <form id="rsvp-form">
            <input type="text" id="nome" name="Nome" placeholder="Nome e Cognome" required>
            <select id="partecipa" name="Partecipa" required>
                <option value="SI">SÌ!</option>
                <option value="NO">NO</option>
            </select>
            <input type="text" id="canzone" name="Canzone" placeholder="Canzone preferita">
            <button type="submit" class="btn-submit" id="submit-btn">INVIA RISPOSTA ⚡️</button>
        </form>
        <div id="success-msg"><h3>✅ INVIATO CON SUCCESSO!</h3></div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        AOS.init();
        new Swiper(".mySwiper", { effect: "coverflow", grabCursor: true, centeredSlides: true, slidesPerView: "auto", loop: true, autoplay: { delay: 2500 } });

        const scriptURL = 'https://script.google.com/macros/s/AKfycbx7HPTQ-piP7fv6KNUNo7ARdDyhrFoNOfUd0OIoRJk1pIvHfzvM_pUqZrtsCcYTrUQK4A/exec';
        const form = document.getElementById('rsvp-form');

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = "INVIANDO...";
            btn.disabled = true;

            fetch(scriptURL, { 
                method: 'POST', 
                body: new FormData(form)
            })
            .then(response => {
                alert("Ciao! La tua risposta è stata inviata correttamente! ✅");
                form.style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            })
            .catch(error => {
                alert("C'è stato un errore. Riprova!");
                btn.innerHTML = "INVIA RISPOSTA ⚡️";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
