<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOEMI 18</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --blu: #0047FF; --argento: #C0C0C0; --nero: #000000; --grigio-scuro: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--nero); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #001133 0%, #000 80%); z-index: -1; }
        
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        h1 { font-family: 'Syncopate', sans-serif; font-size: 3.5rem; margin: 0; background: linear-gradient(to bottom, #fff, var(--blu)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(0, 71, 255, 0.5)); }
        .date-badge { background: var(--blu); padding: 8px 20px; border-radius: 50px; font-weight: 800; letter-spacing: 2px; margin-bottom: 20px; box-shadow: 0 0 20px var(--blu); }

        .swiper { width: 100%; padding: 50px 0; }
        .swiper-slide { width: 280px; height: 380px; border-radius: 20px; overflow: hidden; border: 2px solid var(--blu); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }

        .section-card { background: var(--grigio-scuro); margin: 20px; padding: 30px; border-radius: 25px; border: 1px solid rgba(0, 71, 255, 0.3); text-align: center; }
        .map-frame { width: 100%; height: 250px; border-radius: 15px; border: 1px solid var(--blu); margin-top: 15px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        input, select { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: white; font-size: 1rem; margin-top: 5px; }
        
        .btn-submit { background: var(--blu); color: white; width: 100%; padding: 20px; border: none; border-radius: 15px; font-weight: 800; text-transform: uppercase; box-shadow: 0 0 20px rgba(0, 71, 255, 0.4); margin-top: 10px; cursor: pointer; transition: 0.3s; }
        .btn-submit:disabled { background: #333; cursor: not-allowed; }

        #success-msg { display: none; padding: 20px; color: #00FFCC; font-weight: bold; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header data-aos="zoom-in">
        <div class="date-badge">18 APRILE 2026</div>
        <h1>NOEMI 18</h1>
        <p style="color: var(--argento); letter-spacing: 5px;">THE ELECTRIC NIGHT</p>
    </header>

    <div class="swiper mySwiper" data-aos="fade-up">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="noemi1.jpeg" alt="Noemi 1"></div>
            <div class="swiper-slide"><img src="noemi3.jpeg" alt="Noemi 3"></div>
            <div class="swiper-slide"><img src="noemiq4.jpeg" alt="Noemi 4"></div>
            <div class="swiper-slide"><img src="noemi5.jpeg" alt="Noemi 5"></div>
            <div class="swiper-slide"><img src="noemi6.jpeg" alt="Noemi 6"></div>
            <div class="swiper-slide"><img src="noemi7.jpeg" alt="Noemi 7"></div>
        </div>
    </div>

    <section class="section-card" data-aos="fade-up">
        <h2 style="color: var(--blu);">📍 LOCATION</h2>
        <p>Ospedaletto (Rimini)<br>Via della Festa, 18</p>
        <iframe class="map-frame" src="https://www.google.it/maps/place/Parrocchia+di+San+Patrignano+(Ospedaletto)/@43.9816088,12.5646822,17z/data=!4m12!1m5!3m4!2zNDPCsDU4JzUyLjciTiAxMsKwMzQnMDIuMyJF!8m2!3d43.9813!4d12.5673!3m5!1s0x132ce9b11b07b437:0x490a3331a130ae31!8m2!3d43.9808755!4d12.5674469!16s%2Fg%2F11dyzb20jx?entry=ttu&g_ep=EgoyMDI2MDEwNy4wIKXMDSoASAFQAw%3D%3D"></iframe>
    </section>

    <section class="section-card" data-aos="fade-up" style="background: linear-gradient(145deg, #050505, #111);">
        <h2 style="color: var(--argento);">👔 DRESS CODE</h2>
        <p style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px;">TOTAL BLACK ELEGANT</p>
        <p style="font-size: 0.9rem; opacity: 0.7;">Vesti di nero e divertiti.</p>
    </section>

    <section class="section-card" data-aos="fade-up" style="margin-bottom: 50px;">
        <h2 style="margin-top: 0;">CONFERMA ORA</h2>
        <form id="rsvp-form">
            <div class="form-group">
                <label>Nome e Cognome</label>
                <input type="text" name="Nome" id="nome" placeholder="Scrivi qui..." required>
            </div>
            <div class="form-group">
                <label>Ci sarai?</label>
                <select name="Partecipa" id="partecipa" required>
                    <option value="SI">SÌ, non mancherò!</option>
                    <option value="NO">NO, purtroppo no.</option>
                </select>
            </div>
            <div class="form-group">
                <label>Che canzone vuoi ballare? 🎧</label>
                <input type="text" name="Canzone" id="canzone" placeholder="Titolo canzone...">
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">INVIA RISPOSTA ⚡️</button>
        </form>
        <div id="success-msg">
            <h3>✅ INVIATO CON SUCCESSO!</h3>
            <p>Noemi ha ricevuto la tua conferma. Ci vediamo alla festa!</p>
        </div>
    </section>

    <script>
    // Inizializzazione Grafica
    window.addEventListener('DOMContentLoaded', () => {
        if (typeof AOS !== 'undefined') AOS.init({ duration: 1000, once: true });
        if (typeof Swiper !== 'undefined') {
            new Swiper(".mySwiper", {
                effect: "coverflow",
                centeredSlides: true,
                slidesPerView: "auto",
                loop: true,
                autoplay: { delay: 2500 }
            });
        }
    });

    // SCRIVI QUI IL TUO NUOVO LINK APPENA COPIATO
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMH2tSRZg69niY8ib7x9v_fwF1KF_XMKpbzkYJA3zo9O2zc22fD0cQwJg8AazOeNtI0Q/exec';

    const form = document.getElementById('rsvp-form');

    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.innerHTML = "INVIANDO... ⏳";
        btn.disabled = true;

        // 1. Recuperiamo i valori dai campi
        const nomeValue = document.getElementById('nome').value;
        const partecipaValue = document.getElementById('partecipa').value;
        const canzoneValue = document.getElementById('canzone').value;

        // 2. CREIAMO IL LINK (Questa era la riga mancante!)
        const finalURL = SCRIPT_URL + 
                         "?Nome=" + encodeURIComponent(nomeValue) + 
                         "&Partecipa=" + encodeURIComponent(partecipaValue) + 
                         "&Canzone=" + encodeURIComponent(canzoneValue);

        // 3. Spediamo i dati
        fetch(finalURL, { 
            method: 'POST', 
            mode: 'no-cors' 
        })
        .then(() => {
            // Se arriviamo qui, i dati sono partiti
            alert("GRANDE DIEGO! Dati inviati correttamente. ✅");
            form.style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        })
        .catch(err => {
            console.error(err);
            alert("Errore di rete. Controlla la connessione!");
            btn.disabled = false;
            btn.innerHTML = "INVIA RISPOSTA ⚡️";
        });
    });
</script>
   
</body>
</html>
